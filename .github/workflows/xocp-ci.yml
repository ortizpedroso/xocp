name: xocp-ci

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: xocp-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: ./.github/actions/setup-bun

      - name: Run typecheck
        run: bun typecheck

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: ./.github/actions/setup-bun

      - name: Test packages/app
        timeout-minutes: 15
        run: bun --cwd packages/app test src/i18n/parity.test.ts
        env:
          OPENCODE_EXPERIMENTAL_DISABLE_FILEWATCHER: "true"

      - name: Test packages/core
        # Steps in the same job still stop at the first failing step by default —
        # if: always() is what actually makes this run when Test packages/app fails,
        # instead of silently being skipped (the original bug, one level down).
        if: always()
        timeout-minutes: 15
        run: bun --cwd packages/core test --only-failures
        env:
          OPENCODE_EXPERIMENTAL_DISABLE_FILEWATCHER: "true"

  xocp-docs:
    name: xocp-docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: ./.github/actions/setup-bun

      - name: Check XOCP documentation is generated
        run: bun run check:xocp-docs
